{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4 fw-bold">💳 Checkout</h2>

<div class="row">

  <!-- LEFT: PAYMENT -->
  <div class="col-lg-7">
    <div class="card p-4 shadow-sm">

      <form method="POST">
        {% csrf_token %}

        <h5 class="mb-3">Select Payment Method</h5>

        <!-- PAYMENT OPTIONS -->
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="payment" value="card" checked onclick="toggleFields()">
          <label class="form-check-label">💳 Card</label>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="payment" value="upi" onclick="toggleFields()">
          <label class="form-check-label">📱 UPI</label>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="radio" name="payment" value="cod" onclick="toggleFields()">
          <label class="form-check-label">💵 Cash on Delivery</label>
        </div>

        <!-- CARD FIELDS -->
        <div id="cardFields">
          <input class="form-control mb-2" placeholder="Card Number">
          <input class="form-control mb-2" placeholder="CVV">
          <input class="form-control mb-2" placeholder="Expiry (MM/YY)">
        </div>

        <!-- UPI -->
        <div id="upiField" style="display:none;">
          <input class="form-control mb-2" placeholder="Enter UPI ID">
        </div>

        <button class="btn btn-success w-100 mt-3">Place Order</button>
      </form>

      <a href="{% url 'cart' %}" class="btn btn-link mt-3">⬅ Back to Cart</a>

    </div>
  </div>

  <!-- RIGHT: SUMMARY -->
  <div class="col-lg-5">
    <div class="card p-4 shadow-sm">
      <h5 class="fw-bold">Order Summary</h5>
      <hr>
      <h4 class="text-success">₹{{ total }}</h4>
      <p class="text-muted">Including all taxes</p>
    </div>
  </div>

</div>

<script>
function toggleFields() {
    const payment = document.querySelector('input[name="payment"]:checked').value;

    document.getElementById('cardFields').style.display = (payment === 'card') ? 'block' : 'none';
    document.getElementById('upiField').style.display = (payment === 'upi') ? 'block' : 'none';
}
</script>

{% endblock %}
