{% extends 'base.html' %}

{% block content %}

<h2>Checkout</h2>

<div class="card p-4 shadow">

    <h4>Total: ₹{{ total }}</h4>

    <form method="POST">
        {% csrf_token %}

        <h5>Select Payment Method</h5>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" value="card" checked>
            <label class="form-check-label">💳 Card</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" value="upi">
            <label class="form-check-label">📱 UPI</label>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="payment" value="cod">
            <label class="form-check-label">💵 Cash on Delivery</label>
        </div>

        <!-- Card fields -->
        <input class="form-control mb-2" placeholder="Card Number">
        <input class="form-control mb-2" placeholder="CVV">
        <input class="form-control mb-2" placeholder="Expiry">

        <!-- UPI -->
        <input class="form-control mb-2" placeholder="UPI ID (optional)">

        <button class="btn btn-success w-100">Place Order</button>
    </form>

    <a href="{% url 'cart' %}" class="btn btn-link mt-3">⬅ Back to Cart</a>

</div>

{% endblock %}
