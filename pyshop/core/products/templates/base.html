<!DOCTYPE html>
<html>
<head>
    <title>PyShop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card:hover {
            transform: scale(1.03);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<!-- 🔥 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">🛍 PyShop</a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">

        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'cart' %}">🛒 Cart</a>
          </li>
          <li class="nav-item">
            <a class="nav-link">Hi, {{ user.username }}</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-danger text-white ms-2" href="{% url 'logout' %}">Logout</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link btn btn-success text-white me-2" href="{% url 'login' %}">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-primary text-white" href="{% url 'signup' %}">Signup</a>
          </li>
        {% endif %}

      </ul>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
