<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyShop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card:hover {
            transform: scale(1.03);
            transition: 0.3s;
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .search-box {
            width: 300px;
        }

        @media (max-width: 768px) {
            .search-box {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

<!-- 🔥 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
  <div class="container">

    <a class="navbar-brand" href="/">🛍 PyShop</a>

    <!-- MOBILE TOGGLER -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">

      <!-- SEARCH -->
      <form class="d-flex mx-auto search-box" method="GET" action="/">
        <input class="form-control me-2" name="q" placeholder="Search products...">
        <button class="btn btn-outline-light">Search</button>
      </form>

      <!-- RIGHT SIDE -->
      <ul class="navbar-nav ms-auto align-items-center">

        {% if user.is_authenticated %}

          <!-- CART -->
          <li class="nav-item me-2">
            <a class="nav-link position-relative" href="{% url 'cart' %}">
              🛒 Cart
            </a>
          </li>

          <!-- ORDERS -->
          <li class="nav-item">
            <a class="nav-link" href="{% url 'order_history' %}">
              📦 Orders
            </a>
          </li>

          <!-- WISHLIST -->
          <li class="nav-item">
            <a class="nav-link" href="#">
              ❤️ Wishlist
            </a>
          </li>

          <!-- USER -->
          <li class="nav-item">
            <span class="nav-link text-light">Hi, {{ user.username }}</span>
          </li>

          <!-- LOGOUT -->
          <li class="nav-item">
            <a class="btn btn-danger ms-2" href="{% url 'logout' %}">
              Logout
            </a>
          </li>

        {% else %}

          <li class="nav-item">
            <a class="btn btn-success me-2" href="{% url 'login' %}">
              Login
            </a>
          </li>

          <li class="nav-item">
            <a class="btn btn-primary" href="{% url 'signup' %}">
              Signup
            </a>
          </li>

        {% endif %}

      </ul>
    </div>
  </div>
</nav>

<!-- 🔥 CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<footer class="bg-dark text-light text-center p-3 mt-5">
    <p class="mb-0">© 2026 PyShop | Built with Django 🚀</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
