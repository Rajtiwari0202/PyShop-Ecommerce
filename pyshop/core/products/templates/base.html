<!DOCTYPE html>
<html>
<head>
    <title>PyShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">🛒 PyShop</a>

    <div>
        <a href="/cart/" class="btn btn-outline-light me-2">Cart</a>

        {% if user.is_authenticated %}
            <span class="text-white me-2">Hi, {{ user.username }}</span>
            <a href="/logout/" class="btn btn-danger">Logout</a>
        {% else %}
            <a href="/login/" class="btn btn-success me-2">Login</a>
            <a href="/signup/" class="btn btn-warning">Signup</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
