{% extends 'base.html' %}

{% block title %}Order Success - PyShop{% endblock %}

{% block content %}
<section class="row justify-content-center align-items-center" style="min-height: 72vh;">
    <div class="col-lg-7">
        <div class="panel p-4 p-lg-5 text-center">
            <span class="kicker mx-auto"><i class="bi bi-check2-circle"></i> Payment verified</span>
            <h1 class="section-title mx-auto">Order placed successfully.</h1>
            <p class="section-copy mt-3">Your cart has been converted into a confirmed order and is ready for tracking.</p>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                <a href="{% url 'order_history' %}" class="btn btn-primary btn-lg"><i class="bi bi-box-seam"></i> View orders</a>
                <a href="{% url 'product_list' %}" class="btn btn-outline-dark btn-lg"><i class="bi bi-bag"></i> Continue shopping</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
