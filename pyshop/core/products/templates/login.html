{% extends 'base.html' %}

{% block title %}Login - PyShop{% endblock %}

{% block content %}
<section class="row justify-content-center align-items-center" style="min-height: 72vh;">
    <div class="col-lg-5">
        <div class="panel p-4 p-lg-5">
            <span class="kicker"><i class="bi bi-person-lock"></i> Customer access</span>
            <h1 class="fw-black display-5 mb-2">Welcome back.</h1>
            <p class="text-muted mb-4">Login to manage cart, wishlist, payments, reviews, and order tracking.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button class="btn btn-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </form>

            <p class="text-center mt-4 mb-0">
                New to PyShop?
                <a href="{% url 'signup' %}" class="fw-bold">Create an account</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
