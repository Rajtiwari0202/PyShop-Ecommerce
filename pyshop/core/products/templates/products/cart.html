<!DOCTYPE html>
<html>
<head>
    <title>Your Cart - PyShop</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .btn {
            padding: 5px 10px;
            margin: 2px;
            border: none;
            cursor: pointer;
        }

        .inc { background: green; color: white; }
        .dec { background: orange; color: white; }
        .remove { background: red; color: white; }

        .total {
            text-align: right;
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
  
<div class="container">

    <h1>Your Cart 🛒</h1>

    {% if cart_items %}

        {% for item in cart_items %}
        <div class="cart-item">

            <div>
                <h3>{{ item.product.name }}</h3>
                <p>₹{{ item.product.price }}</p>
            </div>

            <div>
                <a href="{% url 'decrease_quantity' item.product.id %}">
                    <button class="btn dec">-</button>
                </a>

                <strong>{{ item.quantity }}</strong>

                <a href="{% url 'increase_quantity' item.product.id %}">
                    <button class="btn inc">+</button>
                </a>
            </div>

            <div>
                <p>Subtotal: ₹{{ item.subtotal }}</p>

                <a href="{% url 'remove_from_cart' item.product.id %}">
                    <button class="btn remove">Remove</button>
                </a>
            </div>

        </div>
        {% endfor %}

        <div class="total">
            <h2>Total: ₹{{ total_price }}</h2>
        </div>

    {% else %}
        <h2>Cart is empty 😢</h2>
    {% endif %}

    <br>
    <a href="/">⬅ Continue Shopping</a>
    <a href="/checkout/" class="btn btn-primary mt-3">Proceed to Checkout</a>


</div>

</body>
</html>
