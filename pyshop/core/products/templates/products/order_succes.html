{% extends 'base.html' %}

{% block content %}

<div class="text-center mt-5">

    <h1 class="text-success">🎉 Order Placed Successfully!</h1>

    <h4 class="mt-3">Order ID: #{{ order.id }}</h4>
    <h5 class="text-success">₹{{ order.total_amount }}</h5>

    <p class="text-muted">Your order will be delivered soon 🚚</p>

    <div class="mt-4">
        <a href="/" class="btn btn-primary px-4">Continue Shopping</a>
        <a href="{% url 'order_history' %}" class="btn btn-outline-dark px-4">
            View Orders
        </a>
    </div>

</div>

{% endblock %}
