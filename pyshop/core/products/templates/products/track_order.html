<!DOCTYPE html>
<html>
<head>
    <title>Track Order</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:40px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
        }

        .status{
            padding:12px;
            margin:10px 0;
            border-radius:8px;
            background:#eee;
        }

        .active{
            background:#2ecc71;
            color:white;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Track Order #{{ order.id }}</h2>

    <p><strong>Total:</strong> ₹{{ order.total_amount }}</p>
    <p><strong>Current Status:</strong> {{ order.status }}</p>

    <hr>

    <div class="status {% if order.status == 'Pending' %}active{% endif %}">
        Pending
    </div>

    <div class="status {% if order.status == 'Confirmed' %}active{% endif %}">
        Confirmed
    </div>

    <div class="status {% if order.status == 'Shipped' %}active{% endif %}">
        Shipped
    </div>

    <div class="status {% if order.status == 'Out for Delivery' %}active{% endif %}">
        Out for Delivery
    </div>

    <div class="status {% if order.status == 'Delivered' %}active{% endif %}">
        Delivered
    </div>

</div>

</body>
</html>
