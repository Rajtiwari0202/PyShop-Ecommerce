<!DOCTYPE html>
<html>
<head>
    <title>PyShop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .price {
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    <a href="{% url 'cart' %}">Go to Cart 🛒</a>

   <h1>Products</h1>

{% for product in products %}
  <div style="border:1px solid #ccc; padding:10px; margin:10px;">

    <!-- THIS PRODUCT'S LINK -->
    <h2>
      <a href="{% url 'product_detail' product.id %}">
        {{ product.name }}
      </a>
    </h2>

    <p><strong>Price:</strong> ₹{{ product.price }}</p>
    <p>{{ product.description }}</p>

    {% if product.image_url %}
      <img src="{{ product.image_url }}" width="200">
    {% endif %}

  </div>
{% endfor %}
</body>
</html>
