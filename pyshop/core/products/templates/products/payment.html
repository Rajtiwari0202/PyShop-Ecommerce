<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Checkout | PyShop</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
            color: #2ecc71;
            margin: 20px 0;
        }

        .desc {
            color: #777;
            margin-bottom: 30px;
        }

        .pay-btn {
            background: #3399cc;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .pay-btn:hover {
            background: #287aa3;
        }

        .secure {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 Secure Checkout</h2>
    <p class="desc">Complete your payment safely using Razorpay</p>

    <div class="amount">₹{{ total }}</div>

    <button class="pay-btn" id="pay-btn">Pay Now</button>

    <div class="secure">100% Secure Payments • Powered by Razorpay</div>
</div>

<script>
    var options = {
        "key": "{{ razorpay_key }}",
        "amount": "{{ payment.amount }}",
        "currency": "INR",
        "name": "PyShop",
        "description": "Order Payment",
        "order_id": "{{ payment.id }}",

        // ✅ FORCE ENABLE METHODS
        "method": {
            "upi": true,
            "card": true,
            "netbanking": true,
            "wallet": true
        },

        // ✅ Better UX
        "prefill": {
            "name": "{{ request.user.username }}",
            "email": "test@example.com"
        },

        // ✅ Required for smoother checkout
        "config": {
            "display": {
                "blocks": {
                    "upi": {
                        "name": "Pay using UPI",
                        "instruments": [
                            { "method": "upi" }
                        ]
                    }
                },
                "sequence": ["block.upi"],
                "preferences": {
                    "show_default_blocks": true
                }
            }
        },

        "handler": function (response) {

            fetch("/verify-payment/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    window.location.href = "/payment-success/";
                } else {
                    alert("Payment verification failed!");
                }
            });
        },

        "theme": {
            "color": "#3399cc"
        }
    };

    var rzp = new Razorpay(options);

    document.getElementById('pay-btn').onclick = function(e){
        rzp.open();
        e.preventDefault();
    }
</script>

</body>
</html>
