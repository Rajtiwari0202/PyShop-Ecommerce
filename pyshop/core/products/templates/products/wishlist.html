{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">❤️ Your Wishlist</h2>

{% if items %}
<div class="row">
    {% for item in items %}
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm">
            <img src="{{ item.product.image_url }}" class="card-img-top">

            <div class="card-body">
                <h5>{{ item.product.name }}</h5>
                <p>₹{{ item.product.price }}</p>

                <a href="{% url 'product_detail' item.product.id %}" class="btn btn-primary btn-sm">View</a>

                <a href="{% url 'add_to_cart' item.product.id %}" class="btn btn-success btn-sm">
                    Add to Cart
                </a>

                <a href="{% url 'remove_from_wishlist' item.product.id %}" 
                   class="btn btn-danger btn-sm">
                   Remove
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<p>No items in wishlist.</p>
{% endif %}

{% endblock %}
